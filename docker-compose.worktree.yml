# AI-整理日志 worktree 专属部署配置
# 与 main 的 example-wiki 容器并行：独立镜像 tag / 容器名 / 端口 / 命名卷
#   - 镜像:   example-wiki:ai-logs   (改完代码后本 tag 重建，不覆盖 main 的 example-wiki:0.1.0)
#   - 容器:   example-wiki-ai-logs
#   - 端口:   8081 -> 8080        (main 占 8080)
#   - 卷:     example-wiki-data-ai-logs (main 用 example-wiki-data；两容器不可共用 sqlite 库)
# 用法：
#   docker compose -f docker-compose.worktree.yml up -d --build
#   docker compose -f docker-compose.worktree.yml logs -f
#   docker compose -f docker-compose.worktree.yml down
services:
  example-wiki:
    image: example-wiki:ai-logs
    build: .
    container_name: example-wiki-ai-logs
    ports:
      - "8081:8080"
    volumes:
      - example-wiki-data-ai-logs:/data
    environment:
      - TZ=Asia/Shanghai
      - DEFAULT_PASSWORD=CHANGE_ME_PUBLIC_SNAPSHOT_PLACEHOLDER
    restart: unless-stopped

volumes:
  example-wiki-data-ai-logs:
    external: true
