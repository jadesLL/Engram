# html-exit-fix worktree 专属部署（与 main 容器并行隔离）
services:
  example-wiki:
    image: example-wiki:html-exit-fix
    build: .
    container_name: example-wiki-html-exit-fix
    ports: ["8084:8080"]
    volumes: ["example-wiki-data-html-exit-fix:/data"]
    environment:
      - TZ=Asia/Shanghai
      - DEFAULT_PASSWORD=CHANGE_ME_PUBLIC_SNAPSHOT_PLACEHOLDER
    restart: unless-stopped
volumes:
  example-wiki-data-html-exit-fix: {external: true}
