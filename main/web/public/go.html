<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engram 连接中…</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='a' gradientUnits='userSpaceOnUse' x1='24' y1='76' x2='76' y2='22'><stop offset='0' stop-color='%2322D3EE'/><stop offset='1' stop-color='%234D8AFF'/></linearGradient><linearGradient id='b' gradientUnits='userSpaceOnUse' x1='39' y1='39' x2='61' y2='61'><stop offset='0' stop-color='%234D8AFF'/><stop offset='1' stop-color='%23245BDB'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='%230F172A'/><ellipse cx='50' cy='50' rx='36' ry='15.5' fill='none' stroke='url(%23a)' stroke-width='8.5' transform='rotate(-28 50 50)'/><circle cx='74' cy='28.5' r='5' fill='%2322D3EE'/><circle cx='50' cy='50' r='11' fill='url(%23b)'/></svg>" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f6f7f9; color: #1f2329;
    }
    .card { text-align: center; padding: 40px 32px; }
    .logo {
      width: 52px; height: 52px; margin: 0 auto 18px; border-radius: 13px;
      background: #0F172A;
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 14px; margin-bottom: 22px; }
    .spinner {
      width: 26px; height: 26px; margin: 0 auto 18px; border-radius: 50%;
      border: 3px solid #dbe3f4; border-top-color: #3D7BFF;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: none; margin: 0 auto; padding: 10px 28px; border: none; border-radius: 8px;
      background: #3D7BFF; color: #fff; font-size: 15px; cursor: pointer;
    }
    .err { color: #b45555; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 100 100" width="34" height="34" aria-hidden="true"><defs><linearGradient id="engram-orbit-go" gradientUnits="userSpaceOnUse" x1="24" y1="76" x2="76" y2="22"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#4D8AFF"/></linearGradient><linearGradient id="engram-core-go" gradientUnits="userSpaceOnUse" x1="39" y1="39" x2="61" y2="61"><stop offset="0" stop-color="#4D8AFF"/><stop offset="1" stop-color="#245BDB"/></linearGradient></defs><ellipse cx="50" cy="50" rx="36" ry="15.5" fill="none" stroke="url(#engram-orbit-go)" stroke-width="8.5" transform="rotate(-28 50 50)"/><circle cx="74" cy="28.5" r="5" fill="#22D3EE"/><circle cx="50" cy="50" r="11" fill="url(#engram-core-go)"/></svg>
    </div>
    <div class="spinner" id="spin"></div>
    <h1>Engram</h1>
    <p id="msg">正在选择最快的连接方式…</p>
    <button class="btn" id="fallback" type="button">通过 Cloudflare 进入</button>
  </div>
  <script>
    // 本页部署在 Cloudflare 隧道域名上，同源 /health 可读（用户已过 Access OTP）。
    // 若服务器通告了直连地址（DIRECT_ACCESS_URL），优先探测直连（IPv6/局域网，低延迟无中转），
    // 2s 内可达则整页跳转直连；未配置 / 不可达 / 超时则留在隧道进入。
    (function () {
      var PROBE_TIMEOUT_MS = 2000;
      var msg = document.getElementById('msg');
      var fallbackBtn = document.getElementById('fallback');
      var entered = false;

      function enter(url, label) {
        if (entered) return;
        entered = true;
        msg.textContent = label;
        location.replace(url);
      }

      function probe(origin) {
        return new Promise(function (resolve) {
          var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
          var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, PROBE_TIMEOUT_MS) : null;
          fetch(origin + '/health', { mode: 'no-cors', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
            .then(function () { resolve(true); })
            .catch(function () { resolve(false); })
            .then(function () { if (timer) clearTimeout(timer); });
        });
      }

      msg.textContent = '正在选择最快的连接方式…';
      fetch('/health', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (h) {
          var direct = h && h.direct;
          if (!direct) throw new Error('no-direct');
          return probe(direct).then(function (ok) {
            if (ok) enter(direct + '/', '正在通过直连进入…');
            else throw new Error('direct-unreachable');
          });
        })
        .catch(function () {
          enter('/', '正在进入（Cloudflare 隧道）…');
        });

      setTimeout(function () { fallbackBtn.style.display = 'block'; }, 3000);
      fallbackBtn.addEventListener('click', function () { enter('/', '正在进入（Cloudflare 隧道）…'); });
    })();
  </script>
</body>
</html>
