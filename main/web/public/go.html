<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engram 连接中…</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%233D7BFF'/><stop offset='1' stop-color='%23245BDB'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><g fill='%23fff'><rect x='22' y='26' width='10' height='48' rx='5'/><rect x='22' y='26' width='38' height='10' rx='5'/><rect x='22' y='45' width='28' height='10' rx='5'/><rect x='22' y='64' width='38' height='10' rx='5'/><circle cx='69' cy='31' r='6'/><circle cx='59' cy='50' r='6'/><circle cx='69' cy='69' r='6'/></g></svg>" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f6f7f9; color: #1f2329;
    }
    .card { text-align: center; padding: 40px 32px; }
    .logo {
      width: 52px; height: 52px; margin: 0 auto 18px; border-radius: 13px;
      background: linear-gradient(180deg, #3D7BFF, #245BDB); color: #fff;
      font-size: 26px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 14px; margin-bottom: 22px; }
    .spinner {
      width: 26px; height: 26px; margin: 0 auto 18px; border-radius: 50%;
      border: 3px solid #dbe3f4; border-top-color: #3D7BFF;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: none; margin: 0 auto; padding: 10px 28px; border: none; border-radius: 8px;
      background: #3D7BFF; color: #fff; font-size: 15px; cursor: pointer;
    }
    .err { color: #b45555; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">E</div>
    <div class="spinner" id="spin"></div>
    <h1>Engram</h1>
    <p id="msg">正在选择最快的连接方式…</p>
    <button class="btn" id="fallback" type="button">通过 Cloudflare 进入</button>
  </div>
  <script>
    // 智能入口：并发探测直连（/health.direct 发现）与当前隧道路径，先通先用。
    // 本页部署在隧道域名上（同源），直连地址由 /health 的 direct 字段提供。
    (function () {
      var PROBE_TIMEOUT_MS = 4000;
      var spin = document.getElementById('spin');
      var msg = document.getElementById('msg');
      var fallbackBtn = document.getElementById('fallback');

      function probe(origin) {
        return fetch(origin + '/health', { mode: 'no-cors', cache: 'no-store' })
          .then(function () { return true; })
          .catch(function () { return false; });
      }

      // 直连探测：opaque 响应无法读 direct 字段，因此先同源拿 direct 再探直连。
      fetch('/health', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (h) {
          var direct = h && h.direct;
          if (!direct) throw new Error('no-direct');
          msg.textContent = '发现直连通道，正在验证…';
          return probe(direct).then(function (ok) {
            if (ok) { location.replace(direct + '/'); return null; }
            throw new Error('direct-down');
          });
        })
        .catch(function () {
          // 无 direct 字段（未配置）或直连不通：本页已在隧道域名上，直接放行
          msg.textContent = '正在进入（Cloudflare 隧道）…';
          location.replace('/');
        });

      // 兜底：4 秒探测仍未跳转时给手动按钮（页面本身就在隧道路径上）
      setTimeout(function () {
        if (document.visibilityState === 'visible' && !document.hidden) {
          spin.style.display = 'none';
          msg.textContent = '自动选择较慢，可手动进入';
          msg.className = 'err';
          fallbackBtn.style.display = 'inline-block';
        }
      }, PROBE_TIMEOUT_MS);
      fallbackBtn.addEventListener('click', function () { location.replace('/'); });
    })();
  </script>
</body>
</html>
