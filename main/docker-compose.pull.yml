# docker pull 拉取镜像部署（Gitea Registry）
# 镜像名是三层路径 example/engram/engram（owner/repo/imagename，归属仓库），不要写成两层的 example/engram
# 用法：
#   docker login gitea.example.com -u example -p <token>
#   docker compose -f docker-compose.pull.yml up -d
# 注意：不要加 pull_policy: never（禁止拉取，本地无镜像时必报"找不到镜像"）
services:
  engram:
    image: gitea.example.com/example/engram/engram:latest
    container_name: engram
    ports:
      - "8080:8080"
    volumes:
      # 知识库全部数据（markdown 页面 + 附件 + SQLite 索引）都在这个目录
      - ./data:/data
      # 应用内自更新（设置 → 软件更新）需要 Docker API：拉镜像 + 重建本容器。
      # 不需要网页内更新可以删掉这一行。
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OFFICE_EDITOR_ENABLED=false
      - TZ=Asia/Shanghai
      # 初始登录密码（仅首次启动生效；留空则首次登录时在页面设置）
      - DEFAULT_PASSWORD=${DEFAULT_PASSWORD:-}
      # 一键直连域名（可选）：SYNC_ROLE=hub + DDNS_TOKEN/DDNS_RECORD 即首次启动自动成为中枢并维护解析
      - SYNC_ROLE=${SYNC_ROLE:-}
      - DDNS_TOKEN=${DDNS_TOKEN:-}
      - DDNS_RECORD=${DDNS_RECORD:-}
      - DDNS_TYPE=${DDNS_TYPE:-}
      - DDNS_INTERVAL_MIN=${DDNS_INTERVAL_MIN:-}
    restart: unless-stopped
    sysctls:
      net.ipv4.tcp_mtu_probing: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "${ENGRAM_NETWORK_MTU:-1400}"
