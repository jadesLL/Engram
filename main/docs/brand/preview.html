<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Engram 品牌落地预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; background: #fafaf9; color: #1f2329; padding: 28px; }
  h2 { font-size: 18px; margin: 22px 0 12px; }
  .row { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; }
  .cell { text-align: center; }
  .cell .label { font-size: 12px; color: #787774; margin-top: 8px; }
  .banner-box { background: #fff; border: 1px solid #e3e3e0; border-radius: 12px; padding: 18px 24px; display: inline-block; }
  .icon { border-radius: 22%; }
  .round { border-radius: 50%; }
  .on-light { background: #fff; border: 1px solid #e3e3e0; border-radius: 16px; padding: 14px; }
  .rail-sim { display: flex; gap: 14px; }
  .rail-sim .rail { width: 54px; border-radius: 14px; background: #f7f7f5; border: 1px solid #e9e9e7; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .rail-logo-sim { width: 30px; height: 30px; border-radius: 8px; background: #0f172a; display: flex; align-items: center; justify-content: center; }
  .login-sim { width: 240px; border: 1px solid #e9e9e7; border-radius: 12px; background: #fff; padding: 22px; text-align: center; }
  .login-logo { width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 11px; background: #0f172a; display: flex; align-items: center; justify-content: center; }
  .login-sim h1 { font-size: 18px; }
  .login-sim p { font-size: 12px; color: #787774; margin-top: 6px; }
  .splash { border-radius: 10px; border: 1px solid #e3e3e0; }
</style>
</head>
<body>

<h2>README banner（lockup）</h2>
<div class="banner-box">
  <img src="logo-lockup.svg" width="440" alt="lockup" />
</div>

<h2>应用图标（Android launcher / 桌面端）</h2>
<div class="row">
  <div class="cell"><img class="icon" src="../../desktop/build/icon.png" width="160" height="160" /><div class="label">desktop 512</div></div>
  <div class="cell"><img class="icon" src="../../mobile/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" width="96" height="96" /><div class="label">launcher 192</div></div>
  <div class="cell"><img class="round" src="../../mobile/android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png" width="96" height="96" /><div class="label">round 144</div></div>
  <div class="cell"><img src="../../mobile/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png" width="96" height="96" /><div class="label">foreground 432</div></div>
  <div class="cell on-light"><img src="engram-mark.svg" width="96" height="96" /><div class="label">mark（浅底）</div></div>
  <div class="cell"><img class="icon" src="engram-favicon.svg" width="64" height="64" /><div class="label">favicon 64</div></div>
  <div class="cell"><img class="icon" src="engram-favicon.svg" width="32" height="32" /><div class="label">32</div></div>
  <div class="cell"><img class="icon" src="engram-favicon.svg" width="16" height="16" /><div class="label">16</div></div>
</div>

<h2>UI logo 位模拟</h2>
<div class="rail-sim">
  <div class="rail">
    <div class="rail-logo-sim">
      <img src="engram-mark.svg" width="20" height="20" />
    </div>
    <div style="width:22px;height:22px;border-radius:6px;background:#dcdcd9;"></div>
    <div style="width:22px;height:22px;border-radius:6px;background:#dcdcd9;"></div>
  </div>
  <div class="login-sim">
    <div class="login-logo"><img src="engram-mark.svg" width="28" height="28" /></div>
    <h1>Engram</h1>
    <p>请输入密码进入知识库</p>
  </div>
</div>

<h2>启动屏（竖屏 960×1600 缩略）</h2>
<div class="row">
  <div class="cell"><img class="splash" src="../../mobile/android/app/src/main/res/drawable-port-xxhdpi/splash.png" width="180" height="300" /><div class="label">port xxhdpi</div></div>
  <div class="cell"><img class="splash" src="../../mobile/android/app/src/main/res/drawable-land-xxhdpi/splash.png" width="300" height="200" /><div class="label">land xxhdpi</div></div>
</div>

</body>
</html>
