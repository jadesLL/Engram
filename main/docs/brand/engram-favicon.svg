<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Engram favicon / 小尺寸版：轨道与核加粗、去电子，保证 16px 可辨。
       权威生成器：mobile/scripts/gen-icons.cjs -->
  <rect width="100" height="100" rx="22" fill="#0F172A"/>
  <defs>
    <linearGradient id="engram-orbit" gradientUnits="userSpaceOnUse" x1="25" y1="75" x2="75" y2="25">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#4D8AFF"/>
    </linearGradient>
    <linearGradient id="engram-core" gradientUnits="userSpaceOnUse" x1="38" y1="38" x2="62" y2="62">
      <stop offset="0" stop-color="#4D8AFF"/>
      <stop offset="1" stop-color="#245BDB"/>
    </linearGradient>
  </defs>
  <ellipse cx="50" cy="50" rx="34" ry="14.5" fill="none" stroke="url(#engram-orbit)" stroke-width="10" transform="rotate(-28 50 50)"/>
  <circle cx="50" cy="50" r="12" fill="url(#engram-core)"/>
</svg>
