<svg xmlns="http://www.w3.org/2000/svg" width="460" height="120" viewBox="0 0 460 120">
  <!-- Engram 横版 lockup（README banner 用） -->
  <rect x="16" y="16" width="88" height="88" rx="20" fill="#0F172A"/>
  <defs>
    <linearGradient id="engram-orbit" gradientUnits="userSpaceOnUse" x1="32" y1="88" x2="88" y2="32">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#4D8AFF"/>
    </linearGradient>
    <linearGradient id="engram-core" gradientUnits="userSpaceOnUse" x1="52" y1="52" x2="68" y2="68">
      <stop offset="0" stop-color="#4D8AFF"/>
      <stop offset="1" stop-color="#245BDB"/>
    </linearGradient>
  </defs>
  <g transform="translate(60 60) scale(0.88)">
    <ellipse cx="0" cy="0" rx="28" ry="12" fill="none" stroke="url(#engram-orbit)" stroke-width="7" transform="rotate(-28)"/>
    <circle cx="17" cy="-16" r="4" fill="#22D3EE"/>
    <circle cx="0" cy="0" r="8.5" fill="url(#engram-core)"/>
  </g>
  <text x="128" y="66" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="50" font-weight="700" fill="#1f2329">Engram</text>
  <text x="131" y="97" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" fill="#787774">个人知识大脑 · LLM 原生知识库</text>
</svg>
