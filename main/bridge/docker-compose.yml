# ExampleProject IM 桥接服务
# 单独运行；需能访问 ExampleProject 的 /mcp 端点（同机可用 http://example-wiki:8080/mcp）。
services:
  bridge:
    build:
      context: ..
      dockerfile: bridge/Dockerfile
    image: example-wiki-bridge:0.1.0
    container_name: example-wiki-bridge
    ports:
      - "8090:8090"
    environment:
      WIKILLM_MCP_URL: ${WIKILLM_MCP_URL:-http://example-wiki:8080/mcp}
      WIKILLM_MCP_TOKEN: ${WIKILLM_MCP_TOKEN:?需要 ExampleProject MCP token}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      FEISHU_VERIFY_TOKEN: ${FEISHU_VERIFY_TOKEN:-}
      NOTIFY_OPEN_ID: ${NOTIFY_OPEN_ID:-}
      SESSION_MAX_ROUNDS: ${SESSION_MAX_ROUNDS:-6}
      THINK_TIMEOUT_MS: ${THINK_TIMEOUT_MS:-120000}
      TZ: ${TZ:-Asia/Shanghai}
    restart: unless-stopped
    # 若与 ExampleProject 主 compose 同网络，取消下行注释并改用服务名访问
    # networks:
    #   - exampleproject_default
# networks:
#   exampleproject_default:
#     external: true
