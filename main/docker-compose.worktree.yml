# 通用功能 worktree 预览配置。
# 由 scripts/preview-feature.sh 注入功能名、端口和构建网络策略。
services:
  example-wiki:
    image: "example-wiki:${WIKILLM_FEATURE:?请设置 WIKILLM_FEATURE}"
    build:
      context: .
      network: "${WIKILLM_BUILD_NETWORK:-none}"
      labels:
        com.exampleproject.scope: feature
        com.exampleproject.feature: "${WIKILLM_FEATURE}"
    container_name: "example-wiki-${WIKILLM_FEATURE}"
    labels:
      com.exampleproject.scope: feature
      com.exampleproject.feature: "${WIKILLM_FEATURE}"
    ports:
      - "${WIKILLM_PORT:?请设置 WIKILLM_PORT}:8080"
    volumes:
      - worktree-data:/data
    environment:
      TZ: Asia/Shanghai
      DEFAULT_PASSWORD: "${DEFAULT_PASSWORD:-CHANGE_ME_PUBLIC_SNAPSHOT_PLACEHOLDER}"
      OFFICE_EDITOR_ENABLED: "false"
      # 直连地址通告（预览验证用；主 compose 同款透传）
      DIRECT_ACCESS_URL: "${DIRECT_ACCESS_URL:-}"
    sysctls:
      net.ipv4.tcp_mtu_probing: "1"
    restart: unless-stopped

volumes:
  worktree-data:
    name: "example-wiki-data-${WIKILLM_FEATURE}"
    external: true

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "${WIKILLM_NETWORK_MTU:-1400}"
