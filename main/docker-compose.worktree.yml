# 通用功能 worktree 预览配置。
# 由 scripts/preview-feature.sh 注入功能名、端口和构建网络策略。
services:
  engram:
    image: "engram:${ENGRAM_FEATURE:?请设置 ENGRAM_FEATURE}"
    build:
      context: .
      network: "${ENGRAM_BUILD_NETWORK:-none}"
      labels:
        com.engram.scope: feature
        com.engram.feature: "${ENGRAM_FEATURE}"
    container_name: "engram-${ENGRAM_FEATURE}"
    labels:
      com.engram.scope: feature
      com.engram.feature: "${ENGRAM_FEATURE}"
    ports:
      - "${ENGRAM_PORT:?请设置 ENGRAM_PORT}:8080"
    volumes:
      - worktree-data:/data
    environment:
      TZ: Asia/Shanghai
      DEFAULT_PASSWORD: "${DEFAULT_PASSWORD:-}"
      OFFICE_EDITOR_ENABLED: "false"
      # 直连地址通告（预览验证用；主 compose 同款透传）
      DIRECT_ACCESS_URL: "${DIRECT_ACCESS_URL:-}"
    sysctls:
      net.ipv4.tcp_mtu_probing: "1"
    restart: unless-stopped

volumes:
  worktree-data:
    name: "engram-data-${ENGRAM_FEATURE}"
    external: true

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "${ENGRAM_NETWORK_MTU:-1400}"
