services:
  example-wiki:
    image: example-wiki:1.1.15
    build: .
    container_name: example-wiki
    ports:
      - "8080:8080"
    volumes:
      # 知识库全部数据（markdown 页面 + 附件 + SQLite 索引）都在这个目录
      - ./data:/data
    env_file:
      - .env.onlyoffice
    environment:
      - TZ=Asia/Shanghai
      # 初始登录密码（仅首次启动生效，之后可在设置页修改）
      - DEFAULT_PASSWORD=CHANGE_ME_PUBLIC_SNAPSHOT_PLACEHOLDER
      - OFFICE_EDITOR_ENABLED=true
      - OFFICE_INTERNAL_URL=http://onlyoffice
      - OFFICE_INTERNAL_APP_URL=http://example-wiki:8080
      - OFFICE_PUBLIC_PATH=/onlyoffice/
      - OFFICE_INSTANCE_ID=main
    restart: unless-stopped
    sysctls:
      net.ipv4.tcp_mtu_probing: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - onlyoffice

  onlyoffice:
    image: onlyoffice/documentserver:9.4.0
    container_name: example-wiki-onlyoffice
    expose:
      - "80"
    env_file:
      - .env.onlyoffice
    environment:
      - JWT_ENABLED=true
      - JWT_HEADER=AuthorizationJwt
      - JWT_IN_BODY=true
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=false
      - EXAMPLE_ENABLED=false
    volumes:
      - example-wiki-onlyoffice-data:/var/www/onlyoffice/Data
      - example-wiki-onlyoffice-lib:/var/lib/onlyoffice
      - example-wiki-onlyoffice-logs:/var/log/onlyoffice
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

volumes:
  example-wiki-onlyoffice-data:
  example-wiki-onlyoffice-lib:
  example-wiki-onlyoffice-logs:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "${WIKILLM_NETWORK_MTU:-1400}"
