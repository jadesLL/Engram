services:
  engram:
    image: engram:1.1.48
    build: .
    container_name: engram
    ports:
      # 唯一对外映射；Cloudflare Tunnel ingress（systemprofile cloudflared config.yml）
      # 已指向 http://localhost:18080，公网经 wiki.example.com 进来，无需 8080 桥接
      - "18080:8080"
      # HTTPS 直连入口（TLS_DOMAIN 配置时容器内 8443 才监听；宿主 443 需路由器放行到本机）
      - "443:8443"
    volumes:
      # 知识库全部数据（markdown 页面 + 附件 + SQLite 索引）都在这个目录
      - ./data:/data
    env_file:
      - .env.onlyoffice
    environment:
      - TZ=Asia/Shanghai
      # 直连地址通告（IPv6 直连优先的客户端发现入口）。真实值写在部署侧同目录 .env（不入库），
      # 例：DIRECT_ACCESS_URL=http://direct.example.com:18080；未配置时 /health 保持纯文本
      - DIRECT_ACCESS_URL=${DIRECT_ACCESS_URL:-}
      # HTTPS 直连（内置 ACME；TLS_DOMAIN 为空则完全关闭）。真实值在部署侧 .env（不入库）：
      # TLS_DOMAIN=direct.example.com、TLS_DNS_API_TOKEN=<CF token 需 Zone.DNS Edit 权限>
      - TLS_DOMAIN=${TLS_DOMAIN:-}
      - TLS_DNS_API_TOKEN=${TLS_DNS_API_TOKEN:-}
      - TLS_EMAIL=${TLS_EMAIL:-}
      - TLS_ACME_DIRECTORY=${TLS_ACME_DIRECTORY:-}
      # 会话 Cookie 父域（跨子域共享登录态：隧道域/直连域免重登）。例：COOKIE_DOMAIN=.example.com
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      # 初始登录密码（仅首次启动生效；留空则首次登录时在页面设置，仓库不再内置默认值）
      - DEFAULT_PASSWORD=${DEFAULT_PASSWORD:-}
      - OFFICE_EDITOR_ENABLED=true
      - OFFICE_INTERNAL_URL=http://onlyoffice
      - OFFICE_INTERNAL_APP_URL=http://engram:8080
      - OFFICE_PUBLIC_PATH=/onlyoffice/
      - OFFICE_INSTANCE_ID=main
    restart: unless-stopped
    sysctls:
      net.ipv4.tcp_mtu_probing: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - onlyoffice

  onlyoffice:
    image: onlyoffice/documentserver:9.4.0
    container_name: engram-onlyoffice
    expose:
      - "80"
    env_file:
      - .env.onlyoffice
    environment:
      - JWT_ENABLED=true
      - JWT_HEADER=AuthorizationJwt
      - JWT_IN_BODY=true
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=false
      - EXAMPLE_ENABLED=false
    volumes:
      - example-wiki-onlyoffice-data:/var/www/onlyoffice/Data
      - example-wiki-onlyoffice-lib:/var/lib/onlyoffice
      - example-wiki-onlyoffice-logs:/var/log/onlyoffice
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

volumes:
  example-wiki-onlyoffice-data:
  example-wiki-onlyoffice-lib:
  example-wiki-onlyoffice-logs:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "${WIKILLM_NETWORK_MTU:-1400}"
