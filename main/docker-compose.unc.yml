# 适用于 tsclient/UNC 远程目录环境的部署配置
# 说明：本环境下 Docker Desktop 无法绑定挂载 \\tsclient\D\...（"not a valid Windows path"），
# 因此改用命名卷 engram-data 持久化数据。该卷已含最新权威数据（wiki.db + brain）。
# 用法：docker compose -f docker-compose.unc.yml up -d --build
services:
  engram:
    image: engram:0.1.0
    build: .
    container_name: engram
    ports:
      - "18080:8080"
    volumes:
      - engram-data:/data
    environment:
      - OFFICE_EDITOR_ENABLED=false
      - TZ=Asia/Shanghai
      # 初次启动登录密码（仅首次生效；留空则首次登录时在页面设置）
      - DEFAULT_PASSWORD=${DEFAULT_PASSWORD:-}
      # 一键直连域名（可选）：SYNC_ROLE=hub + DDNS_TOKEN/DDNS_RECORD 即首次启动自动成为中枢并维护解析
      - SYNC_ROLE=${SYNC_ROLE:-}
      - DDNS_TOKEN=${DDNS_TOKEN:-}
      - DDNS_RECORD=${DDNS_RECORD:-}
      - DDNS_TYPE=${DDNS_TYPE:-}
      - DDNS_INTERVAL_MIN=${DDNS_INTERVAL_MIN:-}
    restart: unless-stopped
    sysctls:
      net.ipv4.tcp_mtu_probing: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  engram-data:
    external: true

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "${ENGRAM_NETWORK_MTU:-1400}"
