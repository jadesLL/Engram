# NAS 部署（极空间 / 群晖 / 威联通等，x86_64 或 arm64 均需镜像架构匹配）
# 镜像名是三层路径 example/engram/engram（owner/repo/imagename，归属仓库），不要写成两层的 example/engram
# 用法：
#   docker login gitea.xxx.com:11111 -u example -p <package权限token>
#   docker compose -f docker-compose.nas.yml up -d
# 访问 http://<NAS_IP>:${ENGRAM_HOST_PORT:-18080}
# 注意：
#   1) 不要加 pull_policy: never（禁止拉取，本地无镜像时必报"找不到镜像"）
#   2) 极空间/群晖的图形界面不会加载同目录 .env，环境变量要在项目的「环境变量」设置里填，
#      或直接改本文件的字面值。ONLYOFFICE_JWT_SECRET 有内置默认值，不填也能启动。
services:
  engram:
    image: gitea.xxx.com:11111/example/engram/engram:latest
    container_name: engram
    ports:
      # 宿主端口可调（NAS 上 8080 常被系统占用）；改 ENGRAM_HOST_PORT（命令行 .env 或项目环境变量）
      - "${ENGRAM_HOST_PORT:-18080}:8080"
    volumes:
      # 知识库全部数据（markdown 页面 + 附件 + SQLite 索引）都在这个目录
      - "${ENGRAM_DATA_DIR:-./data}:/data"
      # 应用内自更新（设置 → 软件更新）需要 Docker API：拉镜像 + 重建本容器。
      # 注意：挂载 docker.sock 等于给容器宿主 root 权限；NAS 不允许或不需要网页内更新就删掉这一行。
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Shanghai
      # 初始登录密码（仅首次启动生效；留空则首次登录时在页面设置）
      - DEFAULT_PASSWORD=${DEFAULT_PASSWORD:-}
      # ONLYOFFICE 编辑器的 JWT 密钥，与 onlyoffice 服务的 JWT_SECRET 必须同值。
      # 默认值为公开占位，仅在容器内网 engram↔onlyoffice 间使用（onlyoffice 不对外暴露端口）；
      # 想改成自选随机值（openssl rand -hex 32），在 NAS 项目的环境变量里覆盖同名键即可。
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-CHANGE_ME_PUBLIC_SNAPSHOT_PLACEHOLDER}
      - OFFICE_EDITOR_ENABLED=true
      - OFFICE_INTERNAL_URL=http://onlyoffice
      - OFFICE_INTERNAL_APP_URL=http://engram:8080
      - OFFICE_PUBLIC_PATH=/onlyoffice/
      - OFFICE_INSTANCE_ID=main
    restart: unless-stopped
    sysctls:
      net.ipv4.tcp_mtu_probing: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - onlyoffice

  onlyoffice:
    image: onlyoffice/documentserver:9.4.0
    container_name: engram-onlyoffice
    expose:
      - "80"
    environment:
      - JWT_ENABLED=true
      - JWT_HEADER=AuthorizationJwt
      - JWT_IN_BODY=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-CHANGE_ME_PUBLIC_SNAPSHOT_PLACEHOLDER}
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=false
      - EXAMPLE_ENABLED=false
    volumes:
      - engram-onlyoffice-data:/var/www/onlyoffice/Data
      - engram-onlyoffice-lib:/var/lib/onlyoffice
      - engram-onlyoffice-logs:/var/log/onlyoffice
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

volumes:
  # 显式固定卷名：Docker 卷改名即丢数据，不要依赖项目名推导出的默认名
  engram-onlyoffice-data:
    name: engram-onlyoffice-data
  engram-onlyoffice-lib:
    name: engram-onlyoffice-lib
  engram-onlyoffice-logs:
    name: engram-onlyoffice-logs

networks:
  default:
    driver: bridge
    driver_opts:
      # 局域网直连无需公网分片兜底；跨公网/NAS 链路 PMTU 异常时改小（如 1400）
      com.docker.network.driver.mtu: "${ENGRAM_NETWORK_MTU:-1500}"
