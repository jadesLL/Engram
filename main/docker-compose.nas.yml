# NAS 部署（极空间 / 群晖 / 威联通等，x86_64 或 arm64 均需镜像架构匹配）
# 用法：
#   docker login <你的Registry地址> -u <用户名> -p <package权限token>
#   docker compose -f docker-compose.nas.yml up -d
# 访问 http://<NAS_IP>:${ENGRAM_HOST_PORT:-18080}
# 注意：
#   1) ENGRAM_IMAGE 必须改成你的真实镜像地址（三层路径 owner/repo/imagename，
#      不要写成两层的 owner/image，NAS 实测拉取异常）。下方默认值是仓库里的脱敏占位符，
#      真实地址见 Gitea 仓库变量 DOCKER_IMAGE，直接照着填。
#   2) 不要加 pull_policy: never（禁止拉取，本地无镜像时必报"找不到镜像"）
#   3) 极空间/群晖的图形界面不会加载同目录 .env，环境变量要在项目设置里填。
services:
  engram:
    image: ${ENGRAM_IMAGE:-gitea.example.com/example/engram/engram:latest}
    container_name: engram
    ports:
      # 宿主端口可调（NAS 上 8080 常被系统占用）；改 ENGRAM_HOST_PORT（命令行 .env 或项目环境变量）
      - "${ENGRAM_HOST_PORT:-18080}:8080"
    volumes:
      # 知识库全部数据（markdown 页面 + 附件 + SQLite 索引）都在这个目录
      - "${ENGRAM_DATA_DIR:-./data}:/data"
      # 应用内自更新（设置 → 软件更新）需要 Docker API：拉镜像 + 重建本容器。
      # 注意：挂载 docker.sock 等于给容器宿主 root 权限；NAS 不允许或不需要网页内更新就删掉这一行。
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OFFICE_EDITOR_ENABLED=false
      - TZ=Asia/Shanghai
      # 初始登录密码（仅首次启动生效；留空则首次登录时在页面设置）
      - DEFAULT_PASSWORD=${DEFAULT_PASSWORD:-}
      # 一键直连域名（可选）：SYNC_ROLE=hub + DDNS_TOKEN/DDNS_RECORD 即首次启动自动成为中枢并维护解析，
      # 无需登录界面配置（也可留空，之后在 设置 → 多端同步 → DDNS 直连域名 里配）
      - SYNC_ROLE=${SYNC_ROLE:-}
      - DDNS_TOKEN=${DDNS_TOKEN:-}
      - DDNS_RECORD=${DDNS_RECORD:-}
      - DDNS_TYPE=${DDNS_TYPE:-}
      - DDNS_INTERVAL_MIN=${DDNS_INTERVAL_MIN:-}
    restart: unless-stopped
    sysctls:
      net.ipv4.tcp_mtu_probing: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  default:
    driver: bridge
    driver_opts:
      # 局域网直连无需公网分片兜底；跨公网/NAS 链路 PMTU 异常时改小（如 1400）
      com.docker.network.driver.mtu: "${ENGRAM_NETWORK_MTU:-1500}"
