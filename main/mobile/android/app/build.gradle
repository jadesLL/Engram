apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// 版本号与仓库发版版本对齐：自动解析 main/desktop/package.json 的 version（bump 零新增步骤）
def desktopPackageJson = file('../../../desktop/package.json')
def appVersionName = '0.0.0'
if (desktopPackageJson.exists()) {
    def m = desktopPackageJson.text =~ /"version"\s*:\s*"([^"]+)"/
    if (m.find()) appVersionName = m.group(1)
}
def appVersionParts = appVersionName.tokenize('.')
def appVersionCode = 1
if (appVersionParts.size() >= 3) {
    appVersionCode = (appVersionParts[0] as Integer) * 1000000 + (appVersionParts[1] as Integer) * 1000 + (appVersionParts[2] as Integer)
}

// 签名：本地用 key.properties（不入库），CI 用环境变量注入
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def keystorePath = keystoreProperties['storeFile'] ?: System.getenv('ANDROID_KEYSTORE_FILE')
def keystoreStorePassword = keystoreProperties['storePassword'] ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keystoreKeyAlias = keystoreProperties['keyAlias'] ?: System.getenv('ANDROID_KEY_ALIAS')
def keystoreKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv('ANDROID_KEY_PASSWORD')
def debugKeystorePath = System.getenv('ANDROID_DEBUG_KEYSTORE_FILE')
def debugKeystorePassword = System.getenv('ANDROID_DEBUG_KEYSTORE_PASSWORD') ?: 'android'
def debugKeyAlias = System.getenv('ANDROID_DEBUG_KEY_ALIAS') ?: 'engram-local-debug'
def debugKeyPassword = System.getenv('ANDROID_DEBUG_KEY_PASSWORD') ?: debugKeystorePassword

android {
    namespace "com.engram.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.engram.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            if (debugKeystorePath != null) {
                storeFile file(debugKeystorePath)
                storePassword debugKeystorePassword
                keyAlias debugKeyAlias
                keyPassword debugKeyPassword
            }
        }
        release {
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword keystoreStorePassword
                keyAlias keystoreKeyAlias
                keyPassword keystoreKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            // 调试包可与正式版并行安装；release 仍保持 com.engram.app 与既有签名升级链。
            applicationIdSuffix ".debug"
            versionNameSuffix "-local-first-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePath != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "io.ktor:ktor-server-core-jvm:3.1.3"
    implementation "io.ktor:ktor-server-cio-jvm:3.1.3"
    implementation "io.ktor:ktor-server-status-pages-jvm:3.1.3"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
