<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#ffffff" />
  <title>Engram</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2329;
      --muted: #8a9099;
      --accent: #3370ff;
      --accent-press: #245bdb;
      --card: #f5f6f7;
      --border: #e5e6eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a;
        --fg: #e8eaed;
        --muted: #9aa0a6;
        --accent: #4c7dff;
        --accent-press: #6b93ff;
        --card: #242629;
        --border: #34373c;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      visibility: hidden;
    }
    body.ready { visibility: visible; }
    .logo { font-size: 56px; line-height: 1; user-select: none; }
    h1 { font-size: 24px; margin: 16px 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
    form { width: 100%; max-width: 360px; }
    input {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--fg);
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:active { background: var(--accent-press); }
    .msg { color: #d93025; font-size: 13px; min-height: 18px; margin: 10px 0 0; text-align: center; }
    .hint { color: var(--muted); font-size: 12.5px; line-height: 1.6; margin: 6px 0 0; text-align: center; max-width: 360px; }
    .version {
      color: var(--muted);
      font-size: 12px;
      position: fixed;
      bottom: calc(14px + env(safe-area-inset-bottom));
      left: 0; right: 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="logo" style="color:#3D7BFF;font-weight:800">E</div>
  <h1>Engram</h1>
  <p class="sub">连接你的知识库服务器</p>
  <form id="form">
    <input id="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" placeholder="http://192.168.1.101:8080" />
    <button type="submit">连接</button>
  </form>
  <p id="msg" class="msg"></p>
  <p class="hint">填入 Engram 服务器地址（含端口），例如 http://192.168.1.101:8080。<br />首次使用可在服务器网页端完成初始密码设置。</p>
  <p class="version" id="version"></p>
  <script>
    var KEY = 'serverUrl';
    var KEY_LAST_GOOD = 'serverUrlLastGood';
    var params = new URLSearchParams(location.search);
    var Plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
    var PROBE_TIMEOUT_MS = 4000;
    var FAILOVER_DELAY_MS = 1200;

    function normalize(raw) {
      var v = (raw || '').trim();
      if (!v) return '';
      if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
      try {
        var u = new URL(v);
        if (u.protocol !== 'http:' && u.protocol !== 'https:') return '';
        if (!u.hostname) return '';
        return u.origin;
      } catch (e) { return ''; }
    }

    function getSaved() {
      if (!Plugins.Preferences || !Plugins.Preferences.get) return Promise.resolve('');
      return Plugins.Preferences.get({ key: KEY }).then(function (r) { return (r && r.value) || ''; })
        .catch(function () { return ''; });
    }

    function prefGet(key) {
      if (!Plugins.Preferences || !Plugins.Preferences.get) return Promise.resolve(null);
      return Plugins.Preferences.get({ key: key }).then(function (r) { return (r && r.value) || null; })
        .catch(function () { return null; });
    }

    function prefSet(key, value) {
      if (Plugins.Preferences && Plugins.Preferences.set) {
        return Plugins.Preferences.set({ key: key, value: value }).catch(function () {});
      }
      return Promise.resolve();
    }

    // 探活：no-cors fetch opaque 成功 resolve 即视为可达
    function probe(origin) {
      return fetch(origin + '/health', { mode: 'no-cors', cache: 'no-store' })
        .then(function () { return true; })
        .catch(function () { return false; });
    }

    // 从服务端 /health 发现直连地址（env DIRECT_ACCESS_URL；无则返回 null）
    function discoverDirect(origin) {
      return fetch(origin + '/health', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (h) { return (h && h.direct) || null; })
        .catch(function () { return null; });
    }

    // 择优：lastGood 可达直接用；否则并发探「发现直连」与「已保存地址」，先通先走
    function smartConnect(saved, msgEl) {
      return prefGet(KEY_LAST_GOOD).then(function (lastGood) {
        if (lastGood) {
          return probe(lastGood).then(function (ok) {
            if (ok) { location.replace(lastGood); return 'last-good'; }
            return prefSet(KEY_LAST_GOOD, '').then(function () { return null; });
          });
        }
        return null;
      }).then(function (hit) {
        if (hit) return hit;
        var directP = discoverDirect(saved).then(function (direct) {
          if (!direct) return null;
          return probe(direct).then(function (ok) { return ok ? direct : null; });
        });
        var savedP = probe(saved).then(function (ok) { return ok ? saved : null; });
        return Promise.all([directP, savedP]).then(function (r) {
          var direct = r[0], reach = r[1];
          var target = direct || reach;
          if (target) {
            prefSet(KEY_LAST_GOOD, target);
            location.replace(target);
            return direct ? 'direct' : 'tunnel';
          }
          return null;
        });
      });
    }

    function showReady() { document.body.classList.add('ready'); }

    function main() {
      var err = params.get('err');
      if (err) {
        document.getElementById('msg').textContent =
          '正在自动重连…（直连不通时切换隧道）';
      }
      var after = function () {
        var p = getSaved().then(function (saved) {
          if (saved) document.getElementById('url').value = saved;
          // 自动续连：正常启动 / 断连弹回（err）都走智能择优；select=强制停留连接页
          if (saved && !params.has('select')) {
            var msgEl = document.getElementById('msg');
            var attempt = function () {
              return smartConnect(saved, msgEl).then(function (r) {
                if (!r) {
                  // 两路都不通：等一会再试（网络恢复/前缀切换窗口）
                  return new Promise(function (resolve) {
                    setTimeout(function () { resolve(smartConnect(saved, msgEl)); }, FAILOVER_DELAY_MS);
                  });
                }
                return r;
              });
            };
            attempt();
            return;
          }
          showReady();
        });
        return p;
      };
      if (Plugins.App && Plugins.App.getInfo) {
        Plugins.App.getInfo().then(function (info) {
          if (info && info.version) {
            document.getElementById('version').textContent = 'Engram App v' + info.version;
          }
        }).catch(function () {}).then(after);
      } else {
        return after();
      }
    }

    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var msg = document.getElementById('msg');
      var url = normalize(document.getElementById('url').value);
      if (!url) {
        msg.textContent = '地址无效，请检查格式（例：http://192.168.1.101:8080）';
        return;
      }
      msg.textContent = '';
      var save;
      if (Plugins.Preferences && Plugins.Preferences.set) {
        save = Plugins.Preferences.set({ key: KEY, value: url }).catch(function (err) {
          msg.textContent = '保存设置失败：' + ((err && err.message) || err);
          throw err;
        });
      } else {
        save = Promise.reject(new Error('未检测到原生环境（需在 APP 内运行）'));
        save.catch(function (err) { msg.textContent = err.message; });
      }
      save.then(function () {
        prefSet(KEY_LAST_GOOD, '').then(function () { location.replace(url); });
      }).catch(function () {});
    });

    main().then(showReady, showReady);
  </script>
</body>
</html>
