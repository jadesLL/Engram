<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#ffffff" />
  <title>Engram</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2329;
      --muted: #8a9099;
      --accent: #3370ff;
      --accent-press: #245bdb;
      --card: #f5f6f7;
      --border: #e5e6eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a;
        --fg: #e8eaed;
        --muted: #9aa0a6;
        --accent: #4c7dff;
        --accent-press: #6b93ff;
        --card: #242629;
        --border: #34373c;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      visibility: hidden;
    }
    body.ready { visibility: visible; }
    .logo { font-size: 56px; line-height: 1; user-select: none; }
    h1 { font-size: 24px; margin: 16px 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
    form { width: 100%; max-width: 360px; }
    input {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--fg);
      outline: none;
    }
    input + input { margin-top: 8px; }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:active { background: var(--accent-press); }
    .msg { color: #d93025; font-size: 13px; min-height: 18px; margin: 10px 0 0; text-align: center; }
    .hint { color: var(--muted); font-size: 12.5px; line-height: 1.6; margin: 6px 0 0; text-align: center; max-width: 360px; }
    .version {
      color: var(--muted);
      font-size: 12px;
      position: fixed;
      bottom: calc(14px + env(safe-area-inset-bottom));
      left: 0; right: 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="logo" style="color:#3D7BFF;font-weight:800">E</div>
  <h1>Engram</h1>
  <p class="sub">连接你的知识库服务器</p>
  <form id="form">
    <input id="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" placeholder="http://192.168.1.101:8080" />
    <input id="directUrl" type="text" inputmode="url" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" placeholder="直连地址（可选，可用时优先）" />
    <button type="submit">连接</button>
  </form>
  <p id="msg" class="msg"></p>
  <p class="hint">填入 Engram 服务器地址（含端口），例如 http://192.168.1.101:8080。<br />直连地址（IPv6 / 局域网）可用时将优先连接，不可用自动走主地址；可在网页端 设置 → 账户与外观 复制。</p>
  <p class="version" id="version"></p>
  <script>
    var KEY = 'serverUrl';
    var KEY_LAST_GOOD = 'serverUrlLastGood';
    var KEY_DIRECT = 'serverUrlDirect';
    var params = new URLSearchParams(location.search);
    var Plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
    var PROBE_TIMEOUT_MS = 3500;
    var DIRECT_PROBE_TIMEOUT_MS = 1500;
    var FAILOVER_DELAY_MS = 1200;

    function normalize(raw) {
      var v = (raw || '').trim();
      if (!v) return '';
      if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
      try {
        var u = new URL(v);
        if (u.protocol !== 'http:' && u.protocol !== 'https:') return '';
        if (!u.hostname) return '';
        return u.origin;
      } catch (e) { return ''; }
    }

    function getSaved() {
      if (!Plugins.Preferences || !Plugins.Preferences.get) return Promise.resolve('');
      return Plugins.Preferences.get({ key: KEY }).then(function (r) { return (r && r.value) || ''; })
        .catch(function () { return ''; });
    }

    function prefGet(key) {
      if (!Plugins.Preferences || !Plugins.Preferences.get) return Promise.resolve(null);
      return Plugins.Preferences.get({ key: key }).then(function (r) { return (r && r.value) || null; })
        .catch(function () { return null; });
    }

    function prefSet(key, value) {
      if (Plugins.Preferences && Plugins.Preferences.set) {
        return Plugins.Preferences.set({ key: key, value: value }).catch(function () {});
      }
      return Promise.resolve();
    }

    // 探测通道可达性：no-cors opaque 响应 resolve 即认为 TCP+HTTP 可达，硬超时防止 SYN 重传挂死。
    // 直连候选用短超时——正常可达 RTT <150ms，不可达时尽快落主地址；其余候选 3.5s。
    function probe(origin, timeoutMs) {
      var t = timeoutMs || PROBE_TIMEOUT_MS;
      return new Promise(function (resolve) {
        var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
        var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, t) : null;
        fetch(origin + '/health', { mode: 'no-cors', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
          .then(function () { resolve(true); })
          .catch(function () { resolve(false); })
          .then(function () { if (timer) clearTimeout(timer); });
      });
    }

    // 从服务器 /health 发现直连地址（服务端经 CORS 白名单放行本启动页读取）。
    // 走主地址且已有会话 cookie 时成功；被 Cloudflare Access 拦截或网络不通则静默返回 null。
    function discoverDirect(origin) {
      return fetch(origin + '/health', { credentials: 'include', cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (h) {
          var d = h && h.direct ? normalize(h.direct) : '';
          return d || null;
        })
        .catch(function () { return null; });
    }

    // 择优连接：候选顺序「直连地址 → 上次成功通道 → 主地址」，逐个探测首个可达者进入。
    // 直连排第一即「IPv6 优先」：可达时秒进直连；不可达时最多 1.5s 即落回其他通道，
    // 且直连恢复（如路由器放行）后的下一次启动立即切回。页面跳转会杀掉后台 fetch，
    // 因此不做「跳转后补探」——直连每次启动都真探一遍。
    function connectSaved(saved) {
      return Promise.all([prefGet(KEY_LAST_GOOD), prefGet(KEY_DIRECT)]).then(function (vals) {
        var lastGood = vals[0] || '';
        var direct = vals[1] || '';
        var candidates = [];
        if (direct) candidates.push(direct);
        if (lastGood && candidates.indexOf(lastGood) < 0) candidates.push(lastGood);
        if (saved && candidates.indexOf(saved) < 0) candidates.push(saved);
        if (!candidates.length) return null;

        if (saved) {
          discoverDirect(saved).then(function (d) {
            if (d && d !== direct) prefSet(KEY_DIRECT, d);
          });
        }

        var i = 0;
        function tryNext() {
          if (i >= candidates.length) return Promise.resolve(null);
          var cand = candidates[i++];
          var t = cand === direct ? DIRECT_PROBE_TIMEOUT_MS : PROBE_TIMEOUT_MS;
          return probe(cand, t).then(function (ok) {
            if (ok) {
              prefSet(KEY_LAST_GOOD, cand);
              location.replace(cand);
              return 'connected';
            }
            if (cand === lastGood) prefSet(KEY_LAST_GOOD, '');
            return tryNext();
          });
        }
        return tryNext();
      });
    }

    function showReady() { document.body.classList.add('ready'); }

    function main() {
      var err = params.get('err');
      if (err) {
        document.getElementById('msg').textContent = '正在自动重连…';
      }
      var after = function () {
        var p = Promise.all([getSaved(), prefGet(KEY_DIRECT)]).then(function (vals) {
          var saved = vals[0] || '';
          var direct = vals[1] || '';
          if (saved) document.getElementById('url').value = saved;
          if (direct) document.getElementById('directUrl').value = direct;
          // 自动续连：正常启动 / 断连弹回（err）都按候选序列择优；select=强制停留连接页
          if (saved && !params.has('select')) {
            var attempt = function () {
              return connectSaved(saved).then(function (r) {
                if (!r) {
                  return new Promise(function (resolve) {
                    setTimeout(function () { resolve(connectSaved(saved)); }, FAILOVER_DELAY_MS);
                  });
                }
                return r;
              });
            };
            attempt();
            return;
          }
          showReady();
        });
        return p;
      };
      if (Plugins.App && Plugins.App.getInfo) {
        Plugins.App.getInfo().then(function (info) {
          if (info && info.version) {
            document.getElementById('version').textContent = 'Engram App v' + info.version;
          }
        }).catch(function () {}).then(after);
      } else {
        return after();
      }
    }

    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var msg = document.getElementById('msg');
      var url = normalize(document.getElementById('url').value);
      var directUrl = normalize(document.getElementById('directUrl').value);
      if (!url) {
        msg.textContent = '地址无效，请检查格式（例：http://192.168.1.101:8080）';
        return;
      }
      if (document.getElementById('directUrl').value.trim() && !directUrl) {
        msg.textContent = '直连地址格式无效（例：http://192.168.1.101:8080 或 http://[2408:…]:18080）';
        return;
      }
      msg.textContent = '';
      var save;
      if (Plugins.Preferences && Plugins.Preferences.set) {
        save = Promise.all([
          Plugins.Preferences.set({ key: KEY, value: url }),
          Plugins.Preferences.set({ key: KEY_DIRECT, value: directUrl || '' }),
          Plugins.Preferences.set({ key: KEY_LAST_GOOD, value: '' }),
        ]).catch(function (err) {
          msg.textContent = '保存设置失败：' + ((err && err.message) || err);
          throw err;
        });
      } else {
        save = Promise.reject(new Error('未检测到原生环境（需在 APP 内运行）'));
        save.catch(function (err) { msg.textContent = err.message; });
      }
      save.then(function () {
        // 跳转前先尝试发现直连地址并缓存（用户没手填时这是 direct 的唯一来源；
        // 2.5s 内未完成不阻塞跳转，择优留给下一次启动/重连）
        var disc = directUrl
          ? Promise.resolve(directUrl)
          : Promise.race([discoverDirect(url), new Promise(function (r) { setTimeout(function () { r(null); }, 2500); })]);
        disc.then(function (d) {
          if (d) prefSet(KEY_DIRECT, d);
          location.replace(url);
        });
      }).catch(function () {});
    });

    main().then(showReady, showReady);
  </script>
</body>
</html>
