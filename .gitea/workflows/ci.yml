# ExampleProject 持续集成：仅 verify（build + typecheck + test）
# 触发：任意分支推送（v* 标签除外，标签走 release.yml）、PR、手动触发
# 不构建不推送任何镜像——镜像（版本 tag + latest）只在发版时由 release.yml 构建推送
# Runner：Windows 宿主机模式（label: windows），Docker 命令经 Docker Desktop 跑 Linux 容器
name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Windows runner 的 Git Bash 会对参数做 MSYS 路径转换（main → C:/Program Files/Git/main），必须禁用
  MSYS_NO_PATHCONV: '1'

jobs:
  build:
    runs-on: windows
    steps:
      - name: 检出代码
        uses: https://gitea.com/actions/checkout@v4

      - name: verify 阶段（build + typecheck + test）
        shell: bash
        run: docker build --target verify -t example-wiki:ci-verify main
