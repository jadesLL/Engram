# Engram 发布流程：版本号 Docker 镜像 + Windows NSIS 安装包 + Gitea Release
# 触发：
#   - 推送 v* 标签（如 v1.1.5）：完整发布（镜像推送 + exe 构建 + 创建 Release 上传附件）
#   - 手动 workflow_dispatch：测试模式（镜像推送 + exe 构建 + 产物上传为 Artifact，不创建 Release）
# 注意：标签名必须与 main/desktop/package.json 的 version 一致（v<version>），否则校验失败
# Runner：Windows 宿主机模式（label: windows），Docker 命令经 Docker Desktop 跑 Linux 容器
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: gitea.example.com
  # 镜像走「owner/repo/imagename」三层路径，归属仓库（与 XINJE 一致）；
  # 两层路径归属用户命名空间，NAS 实测拉取异常，不要改回
  IMAGE: gitea.example.com/example/engram/engram

jobs:
  release:
    runs-on: windows
    steps:
      - name: 检出代码
        uses: https://gitea.com/actions/checkout@v4

      - name: 提取版本号（main/desktop/package.json）
        id: ver
        shell: bash
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' main/desktop/package.json | head -n1)
          if [ -z "$VERSION" ]; then
            echo "无法从 main/desktop/package.json 提取版本号"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号: $VERSION"

      - name: 校验标签与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "v${{ steps.ver.outputs.version }}" != "${GITHUB_REF_NAME}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 desktop/package.json 版本号 ${{ steps.ver.outputs.version }} 不一致"
            exit 1
          fi

      - name: 提取 CHANGELOG 版本段落
        id: changelog
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          # 提取 "## v<版本>（日期）" 到下一个 "## " 之间的段落
          BODY=$(awk -v ver="## v${VER}" '
            $0 ~ "^## " {
              if (found) exit
              if (index($0, ver) == 1) { found = 1 }
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "CHANGELOG.md 中缺少 v${VER} 版本段落（格式：## v${VER}（YYYY-MM-DD））"
            echo "发版前必须把距上次发布以来的所有新功能写入 CHANGELOG.md 对应版本段落"
            exit 1
          fi
          # 写入多行输出（%0A 转义换行）
          echo "body<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          echo ">> 已提取 v${VER} 段落："
          echo "$BODY" | head -5

      - name: 构建并推送 Docker 镜像
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          docker build --label org.opencontainers.image.version="$VER" -t "$IMAGE:$VER" -t "$IMAGE:latest" main
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          docker push "$IMAGE:$VER"
          docker push "$IMAGE:latest"

      - name: 构建 Windows 安装包（wine 容器内交叉打包，docker cp 拷出产物）
        shell: bash
        env:
          # Windows runner 的 Git Bash 会对参数做 MSYS 路径转换（main → C:/Program Files/Git/main），必须禁用
          MSYS_NO_PATHCONV: '1'
        run: |
          # 上下文用 . 而非 main：Windows runner 上 docker CLI 解析相对路径上下文时
          # 对 Git Bash 的 UNC cwd 处理有问题，cd 进 main 后用 . 稳定可靠
          cd main
          docker build -f desktop/Dockerfile.ci -t engram-desktop-builder .
          CID=$(docker create engram-desktop-builder)
          docker cp "$CID:/work/desktop/dist/." ../desktop-dist
          docker rm "$CID" > /dev/null
          cd ..
          echo ">> 构建产物："
          ls -la desktop-dist

      - name: 构建 Android APK（Linux 容器内打包，签名密钥经环境变量注入）
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd main
          # 镜像只准备构建环境（JDK + Android SDK + 源码），gradle 构建在 run 时执行，
          # keystore 经容器环境变量注入，不进入镜像层
          docker build -f mobile/Dockerfile.ci -t engram-android-builder .
          docker rm engram-android-build > /dev/null 2>&1 || true
          docker run --name engram-android-build \
            -e ANDROID_KEYSTORE_BASE64 -e ANDROID_KEYSTORE_PASSWORD \
            -e ANDROID_KEY_ALIAS -e ANDROID_KEY_PASSWORD \
            engram-android-builder bash mobile/scripts/build-apk-ci.sh
          mkdir -p ../mobile-apk-dist
          docker cp "engram-android-build:/work/mobile/android/app/build/outputs/apk/release/." ../mobile-apk-dist
          docker rm engram-android-build > /dev/null
          cd ..
          echo ">> 构建产物："
          ls -la mobile-apk-dist

      - name: 整理发布产物并计算校验值
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          EXE="desktop-dist/Engram Setup ${VER}.exe"
          if [ ! -f "$EXE" ]; then
            echo "未找到安装包: $EXE"
            ls -la desktop-dist || true
            exit 1
          fi
          # APK：优先取已签名产物，未配置签名时回退未签名包
          APK=""
          for f in "mobile-apk-dist/app-release.apk" "mobile-apk-dist/app-release-unsigned.apk"; do
            if [ -f "$f" ]; then APK="$f"; break; fi
          done
          if [ -z "$APK" ]; then
            echo "未找到 APK 产物"
            ls -la mobile-apk-dist || true
            exit 1
          fi
          mkdir -p release-out
          cp "$EXE" "release-out/Engram Setup ${VER}.exe"
          cp "$APK" "release-out/Engram ${VER}.apk"
          docker save "$IMAGE:$VER" | gzip > "release-out/engram-${VER}.tar.gz"
          cd release-out
          sha256sum "Engram Setup ${VER}.exe" "Engram ${VER}.apk" "engram-${VER}.tar.gz" > "sha256-${VER}.txt"
          cat "sha256-${VER}.txt"

      - name: 上传构建产物（手动触发测试模式）
        if: github.event_name == 'workflow_dispatch'
        uses: https://gitea.com/actions/upload-artifact@v4
        with:
          name: engram-release-test-${{ steps.ver.outputs.version }}
          path: release-out/
          retention-days: 7

      - name: 创建 Release 并上传附件
        if: startsWith(github.ref, 'refs/tags/')
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: --experimental-fetch
        with:
          files: |
            release-out/Engram Setup *.exe
            release-out/Engram *.apk
            release-out/engram-*.tar.gz
            release-out/sha256-*.txt
          token: ${{ secrets.RELEASE_TOKEN }}
          draft: false
          name: v${{ steps.ver.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.body }}

            ---

            - Docker 镜像: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}（私有，需先 docker login）
            - Windows 安装包: Engram Setup ${{ steps.ver.outputs.version }}.exe
            - Android APK: Engram ${{ steps.ver.outputs.version }}.apk
            - 校验值见 sha256-${{ steps.ver.outputs.version }}.txt
            - 完整历史版本: 仓库 CHANGELOG.md
