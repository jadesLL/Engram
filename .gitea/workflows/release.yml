# Engram 发布流程（2026-09-08 瘦身，对齐 Hermes 式发版：tag+changelog 即发版，二进制不随 tag 打包）：
#   推送 v* 标签 = 发版：CHANGELOG 校验 → verify 门禁 → 构建推送 Docker 镜像（:<版本> + :latest）→ 创建 Release（正文=CHANGELOG 段落，无二进制附件）
#   手动 workflow_dispatch = 按需补产：verify 门禁 → 勾选构建 Windows exe / Android APK / docker tar.gz，补挂到对应版本 Release
# 版本 tag 的 Docker 镜像仍是唯一默认发版产物（NAS 部署 + 应用内一键更新的版本信号源）
# 注意：标签名必须与 main/desktop/package.json 的 version 一致（v<version>），否则校验失败
# Runner：Windows 宿主机模式（label: windows），Docker 命令经 Docker Desktop 跑 Linux 容器
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要补产物的已发版标签（如 v1.2.4，须与该提交的 package.json 版本一致）'
        required: true
        type: string
      binaries:
        description: '构建 Windows exe + Android APK 并补挂 Release'
        type: boolean
        default: false
      offline_image:
        description: '构建 docker tar.gz 离线镜像包并补挂 Release'
        type: boolean
        default: false

env:
  # Registry 与镜像地址直接写真实值（仓库私有，脱敏只会让产物指向不存在的域名）；
  # 仍保留 repo 变量 DOCKER_REGISTRY / DOCKER_IMAGE 覆盖能力，便于换仓时不动代码
  REGISTRY: ${{ vars.DOCKER_REGISTRY || 'gitea.example.com' }}
  # 镜像走「owner/repo/imagename」三层路径，归属仓库；
  # 两层路径归属用户命名空间，NAS 实测拉取异常，不要改回
  IMAGE: ${{ vars.DOCKER_IMAGE || 'gitea.example.com/example/engram/engram' }}

jobs:
  release:
    runs-on: windows
    steps:
      - name: 检出代码（dispatch 按输入标签检出）
        uses: https://gitea.com/actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 提取版本号（main/desktop/package.json）
        id: ver
        shell: bash
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' main/desktop/package.json | head -n1)
          if [ -z "$VERSION" ]; then
            echo "无法从 main/desktop/package.json 提取版本号"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号: $VERSION"

      - name: 校验标签与版本号一致
        shell: bash
        run: |
          # tag 推送路径取 GITHUB_REF_NAME；dispatch 路径取 inputs.tag
          REF_NAME="${GITHUB_REF_NAME}"
          if [ -n "$INPUT_TAG" ]; then REF_NAME="$INPUT_TAG"; fi
          if [ "v${{ steps.ver.outputs.version }}" != "$REF_NAME" ]; then
            echo "标签 $REF_NAME 与 desktop/package.json 版本号 ${{ steps.ver.outputs.version }} 不一致"
            exit 1
          fi
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: 校验 dispatch 参数（至少勾选一项产物）
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "$INPUT_BINARIES" != "true" ] && [ "$INPUT_OFFLINE" != "true" ]; then
            echo "dispatch 必须至少勾选 binaries 或 offline_image 之一；正式发版请推 v* 标签"
            exit 1
          fi
        env:
          INPUT_BINARIES: ${{ inputs.binaries }}
          INPUT_OFFLINE: ${{ inputs.offline_image }}

      - name: 提取 CHANGELOG 版本段落
        id: changelog
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          # 提取 "## v<版本>（日期）" 到下一个 "## " 之间的段落
          BODY=$(awk -v ver="## v${VER}" '
            $0 ~ "^## " {
              if (found) exit
              if (index($0, ver) == 1) { found = 1 }
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "CHANGELOG.md 中缺少 v${VER} 版本段落（格式：## v${VER}（YYYY-MM-DD））"
            echo "发版前必须把距上次发布以来的所有新功能写入 CHANGELOG.md 对应版本段落"
            exit 1
          fi
          # 写入多行输出（%0A 转义换行）
          echo "body<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          echo ">> 已提取 v${VER} 段落："
          echo "$BODY" | head -5

      - name: verify 门禁（build + typecheck + test，与 ci.yml 同标准）
        shell: bash
        run: |
          # 发版门禁：任何产物构建/推送前先完整 verify。main 连红期间 release 曾照常
          # 发版（v1.1.22~v1.1.28），此步骤保证带标签的产物只能来自测试通过的代码
          cd main
          docker build --target verify -t engram:release-verify .

      - name: 构建并推送 Docker 镜像（发版）
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          # ENGRAM_GIT_SHA 烤进镜像 /app/GIT_SHA：镜像内没有 .git，应用内靠它显示提交号
          docker build --build-arg ENGRAM_GIT_SHA="${{ github.sha }}" \
            --label org.opencontainers.image.version="$VER" -t "$IMAGE:$VER" -t "$IMAGE:latest" main
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          docker push "$IMAGE:$VER"
          docker push "$IMAGE:latest"

      - name: 构建本地镜像（dispatch 补离线包用，不推送）
        if: github.event_name == 'workflow_dispatch' && inputs.offline_image == true
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          docker build --build-arg ENGRAM_GIT_SHA="${{ github.sha }}" \
            --label org.opencontainers.image.version="$VER" -t "$IMAGE:$VER" main

      - name: 构建 Windows 安装包（wine 容器内交叉打包，docker cp 拷出产物）
        if: github.event_name == 'workflow_dispatch' && inputs.binaries == true
        shell: bash
        env:
          # Windows runner 的 Git Bash 会对参数做 MSYS 路径转换（main → C:/Program Files/Git/main），必须禁用
          MSYS_NO_PATHCONV: '1'
        run: |
          # 上下文用 . 而非 main：Windows runner 上 docker CLI 解析相对路径上下文时
          # 对 Git Bash 的 UNC cwd 处理有问题，cd 进 main 后用 . 稳定可靠
          cd main
          docker build -f desktop/Dockerfile.ci -t engram-desktop-builder .
          CID=$(docker create engram-desktop-builder)
          docker cp "$CID:/work/desktop/dist/." ../desktop-dist
          docker rm "$CID" > /dev/null
          cd ..
          echo ">> 构建产物："
          ls -la desktop-dist

      - name: 构建 Android APK（Linux 容器内打包，签名密钥经环境变量注入）
        if: github.event_name == 'workflow_dispatch' && inputs.binaries == true
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd main
          # 镜像只准备构建环境（JDK + Android SDK + 源码），gradle 构建在 run 时执行，
          # keystore 经容器环境变量注入，不进入镜像层
          docker build -f mobile/Dockerfile.ci -t engram-android-builder .
          docker rm engram-android-build > /dev/null 2>&1 || true
          docker run --name engram-android-build \
            -e ANDROID_KEYSTORE_BASE64 -e ANDROID_KEYSTORE_PASSWORD \
            -e ANDROID_KEY_ALIAS -e ANDROID_KEY_PASSWORD \
            engram-android-builder bash mobile/scripts/build-apk-ci.sh
          mkdir -p ../mobile-apk-dist
          docker cp "engram-android-build:/work/mobile/android/app/build/outputs/apk/release/." ../mobile-apk-dist
          docker rm engram-android-build > /dev/null
          cd ..
          echo ">> 构建产物："
          ls -la mobile-apk-dist

      - name: 整理产物并计算校验值（dispatch）
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          INPUT_BINARIES: ${{ inputs.binaries }}
          INPUT_OFFLINE: ${{ inputs.offline_image }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p release-out
          if [ "$INPUT_BINARIES" = "true" ]; then
            EXE="desktop-dist/Engram Setup ${VER}.exe"
            if [ ! -f "$EXE" ]; then
              echo "未找到安装包: $EXE"
              ls -la desktop-dist || true
              exit 1
            fi
            # APK：优先取已签名产物，未配置签名时回退未签名包
            APK=""
            for f in "mobile-apk-dist/app-release.apk" "mobile-apk-dist/app-release-unsigned.apk"; do
              if [ -f "$f" ]; then APK="$f"; break; fi
            done
            if [ -z "$APK" ]; then
              echo "未找到 APK 产物"
              ls -la mobile-apk-dist || true
              exit 1
            fi
            cp "$EXE" "release-out/Engram Setup ${VER}.exe"
            cp "$APK" "release-out/Engram ${VER}.apk"
          fi
          if [ "$INPUT_OFFLINE" = "true" ]; then
            docker save "$IMAGE:$VER" | gzip > "release-out/engram-${VER}.tar.gz"
          fi
          cd release-out
          sha256sum ./* > "sha256-${VER}.txt"
          cat "sha256-${VER}.txt"

      - name: 上传产物到 Artifact（dispatch，保底下载入口）
        if: github.event_name == 'workflow_dispatch'
        uses: https://gitea.com/actions/upload-artifact@v4
        with:
          name: engram-release-${{ steps.ver.outputs.version }}
          path: release-out/
          retention-days: 7

      - name: 创建 Release（发版，正文=CHANGELOG 段落）
        if: startsWith(github.ref, 'refs/tags/')
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: --experimental-fetch
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          draft: false
          name: v${{ steps.ver.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.body }}

            ---

            - Docker 镜像: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}（私有，需先 docker login）
            - Windows exe / Android APK / 离线 tar.gz 不随发版构建；需要分发时到 Actions → Release → Run workflow 输入本标签按需构建，产物自动补挂到本 Release

      - name: 补挂产物到已发布 Release（dispatch）
        if: github.event_name == 'workflow_dispatch'
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: --experimental-fetch
        with:
          files: release-out/*
          token: ${{ secrets.RELEASE_TOKEN }}
          draft: false
          # 显式指定目标 tag：dispatch 时 GITHUB_REF_NAME 是触发分支（main）而非发版标签，
          # 不传 tag_name 会按 main 找/建 Release——曾把产物误挂到 stray main 标签的 Release（#325）
          tag_name: ${{ inputs.tag }}
          name: v${{ steps.ver.outputs.version }}
          # 正文重新传 CHANGELOG 段落，避免 action 把已发布正文覆盖为空
          body: |
            ${{ steps.changelog.outputs.body }}
